<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Formulario de entrenador</title>
  <style>
    body{font-family:Arial,sans-serif;background:#eef5fb;color:#183153;margin:0}
    .wrap{max-width:650px;margin:45px auto;background:white;border-radius:12px;box-shadow:0 5px 20px #1233;overflow:hidden}
    header{background:#002855;color:white;padding:25px}
    header h1{margin:0}
    .content{padding:30px}
    label{display:block;font-weight:bold;margin:18px 0 7px}
    input,select{width:100%;box-sizing:border-box;padding:12px;border:1px solid #bdccda;border-radius:7px;font-size:16px}
    .btn{background:#0877a8;border:0;border-radius:7px;color:white;padding:12px 18px;cursor:pointer;font-weight:bold}
    .back{color:#002855;margin-left:16px}
    .alert{background:#fff1f2;border-left:5px solid #be123c;padding:13px;border-radius:7px;color:#9f1239;margin-bottom:16px}
  </style>
</head>
<body>
<div th:replace="~{fragments :: menu}"></div>
<main class="wrap">
  <header><h1 th:text="${tituloFormulario}">Datos del entrenador</h1></header>
  <section class="content">
    <div class="alert" role="alert" th:if="${error != null}" th:text="${error}"></div>
    <!-- Una sola plantilla vale para alta y edición; el ID oculto identifica la edición. -->
    <form th:action="@{/entrenadores/guardar}" method="post">
      <input type="hidden" name="id" th:if="${id != null}" th:value="${id}">

      <label for="nombre">Nombre del entrenador</label>
      <input id="nombre" name="nombre" th:value="${nombre}" maxlength="60" required>

      <label for="tipo">Tipo de entrenador</label>
      <select id="tipo" name="tipo" required>
        <option value="">Selecciona un tipo</option>
        <option th:each="opcion : ${tipos}"
                th:value="${opcion}"
                th:text="${opcion}"
                th:selected="${opcion == tipo}">Tipo</option>
      </select>

      <div style="margin-top:25px">
        <button class="btn" type="submit">Guardar entrenador</button>
        <a class="back" th:href="@{/entrenadores}">Cancelar</a>
      </div>
    </form>
  </section>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body>
</html>
